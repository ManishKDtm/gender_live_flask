<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Gender Detection</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;

            min-height: 100vh;

            display: flex;
            overflow: hidden;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 210px;

            background: #2b2b45;

            padding: 20px;

            display: flex;
            flex-direction: column;

            gap: 15px;
        }

        .sidebar h2 {
            color: #00ffd0;
            font-size: 1.3rem;

            margin-bottom: 10px;
        }

        .sidebar button {
            background: #00ffd0;
            color: #000;

            border: none;

            padding: 12px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 0.95rem;
            font-weight: bold;
        }

        .sidebar button:hover {
            opacity: 0.85;
        }

        .sidebar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 20px;

            min-width: 0;
        }

        h1 {
            color: #00ffd0;

            margin-bottom: 20px;

            font-size: 1.8rem;
        }

        /* =====================================================
           VIDEO CONTAINER
        ===================================================== */

        .video-container {
            position: relative;

            width: 90%;
            max-width: 700px;

            aspect-ratio: 4 / 3;

            background: #000;

            border: 3px solid #00ffd0;

            border-radius: 12px;

            overflow: hidden;
        }

        /*
         * Keep the real webcam visible.
         */
        #webcam {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transform: scaleX(-1);
        }

        /*
         * Processed image is placed over the webcam.
         */
        #processedImage {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            display: none;

            pointer-events: none;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            position: absolute;

            top: 12px;
            left: 12px;
            right: 12px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            padding: 10px 14px;

            border-radius: 8px;

            font-size: 0.9rem;

            text-align: center;

            z-index: 10;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: rgba(0, 0, 0, 0.75);

            padding: 15px 20px;

            border-radius: 8px;

            display: none;

            z-index: 20;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            margin-top: 15px;

            font-size: 0.8rem;

            color: #888;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                flex-direction: column;
                overflow: auto;
            }

            .sidebar {
                width: 100%;

                flex-direction: row;

                align-items: center;

                padding: 10px;

                gap: 10px;
            }

            .sidebar h2 {
                display: none;
            }

            .sidebar button {
                flex: 1;
            }

            .main {
                min-height: calc(100vh - 70px);

                padding: 10px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .video-container {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div class="sidebar">

        <h2>Detector</h2>

        <button
            id="toggleButton"
            onclick="toggleDetection()"
        >
            ▶ Start Detection
        </button>

        <button
            id="snapshotButton"
            onclick="takeSnapshot()"
        >
            📸 Snapshot
        </button>

    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <div class="main">

        <h1>Live Gender Detection</h1>

        <div class="video-container">

            <!-- Real webcam -->
            <video
                id="webcam"
                autoplay
                playsinline
                muted
            ></video>

            <!-- Processed frame -->
            <img
                id="processedImage"
                alt="Processed frame"
            >

            <!-- Status -->
            <div
                class="status"
                id="status"
            >
                Starting camera...
            </div>

            <!-- Loading -->
            <div
                class="loading"
                id="loading"
            >
                Processing...
            </div>

        </div>

        <footer>
            Made by Manish KD
        </footer>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        const video =
            document.getElementById("webcam");

        const processedImage =
            document.getElementById("processedImage");

        const status =
            document.getElementById("status");

        const loading =
            document.getElementById("loading");

        const toggleButton =
            document.getElementById("toggleButton");

        const snapshotButton =
            document.getElementById("snapshotButton");


        let stream = null;

        let isDetecting = false;

        /*
         * Prevent multiple simultaneous requests.
         */
        let processingFrame = false;

        /*
         * Canvas used to capture webcam frames.
         */
        const canvas =
            document.createElement("canvas");

        const ctx =
            canvas.getContext("2d");


        /* =====================================================
           STATUS FUNCTION
        ====================================================== */

        function setStatus(message) {

            status.textContent = message;

        }


        /* =====================================================
           START WEBCAM
        ====================================================== */

        async function startWebcam() {

            try {

                setStatus("Requesting camera permission...");

                stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            width: {
                                ideal: 640
                            },

                            height: {
                                ideal: 480
                            },

                            facingMode: "user"
                        },

                        audio: false

                    });


                video.srcObject = stream;


                /*
                 * Wait until video dimensions are available.
                 */

                await new Promise((resolve) => {

                    if (video.readyState >= 2) {

                        resolve();

                    } else {

                        video.onloadedmetadata =
                            () => resolve();

                    }

                });


                canvas.width =
                    video.videoWidth || 640;

                canvas.height =
                    video.videoHeight || 480;


                setStatus(
                    "Camera ready. Click Start Detection."
                );


                console.log(
                    "Camera resolution:",
                    video.videoWidth,
                    "x",
                    video.videoHeight
                );


            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                setStatus(
                    "Camera error: " + error.message
                );

            }

        }


        /* =====================================================
           TOGGLE DETECTION
        ====================================================== */

        function toggleDetection() {

            if (isDetecting) {

                stopDetection();

            } else {

                startDetection();

            }

        }


        /* =====================================================
           START DETECTION
        ====================================================== */

        function startDetection() {

            if (!stream) {

                setStatus(
                    "Camera is not available."
                );

                return;

            }


            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                setStatus(
                    "Camera is still starting..."
                );

                return;

            }


            isDetecting = true;


            toggleButton.textContent =
                "⏹ Stop Detection";


            setStatus(
                "Detecting..."
            );


            /*
             * Start the processing loop.
             */
            processFrame();

        }


        /* =====================================================
           STOP DETECTION
        ====================================================== */

        function stopDetection() {

            isDetecting = false;

            toggleButton.textContent =
                "▶ Start Detection";


            loading.style.display =
                "none";


            processedImage.style.display =
                "none";


            setStatus(
                "Detection stopped."
            );

        }


        /* =====================================================
           PROCESS FRAME
        ====================================================== */

        async function processFrame() {

            if (!isDetecting) {
                return;
            }


            /*
             * Don't send another request while
             * the previous request is still processing.
             */

            if (processingFrame) {

                setTimeout(
                    processFrame,
                    100
                );

                return;

            }


            processingFrame = true;


            try {

                /*
                 * Make sure the camera is ready.
                 */

                if (
                    video.videoWidth === 0 ||
                    video.videoHeight === 0
                ) {

                    processingFrame = false;

                    setTimeout(
                        processFrame,
                        200
                    );

                    return;

                }


                /* -------------------------------------------------
                   Set canvas size
                -------------------------------------------------- */

                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;


                /* -------------------------------------------------
                   Capture webcam frame
                -------------------------------------------------- */

                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                /* -------------------------------------------------
                   Convert to JPEG
                -------------------------------------------------- */

                const imageData =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.65
                    );


                console.log(
                    "Sending frame to Flask..."
                );


                loading.style.display =
                    "block";


                /* -------------------------------------------------
                   Send to Flask
                -------------------------------------------------- */

                const response =
                    await fetch(
                        "/process_frame",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                image: imageData
                            })
                        }
                    );


                console.log(
                    "Server response:",
                    response.status
                );


                /* -------------------------------------------------
                   Check HTTP status
                -------------------------------------------------- */

                if (!response.ok) {

                    throw new Error(
                        "Server returned HTTP " +
                        response.status
                    );

                }


                /* -------------------------------------------------
                   Parse JSON
                -------------------------------------------------- */

                const result =
                    await response.json();


                console.log(
                    "Detection result:",
                    result
                );


                /* -------------------------------------------------
                   Handle Flask error
                -------------------------------------------------- */

                if (!result.success) {

                    throw new Error(
                        result.error ||
                        "Unknown server error"
                    );

                }


                /* -------------------------------------------------
                   Display processed frame
                -------------------------------------------------- */

                if (result.image) {

                    processedImage.src =
                        result.image;

                    processedImage.style.display =
                        "block";

                }


                /* -------------------------------------------------
                   Display prediction
                -------------------------------------------------- */

                if (
                    result.predictions &&
                    result.predictions.length > 0
                ) {

                    const pred =
                        result.predictions[0];


                    const gender =
                        pred.gender;

                    const confidence =
                        (
                            pred.confidence * 100
                        ).toFixed(1);


                    setStatus(
                        gender +
                        " — " +
                        confidence +
                        "%"
                    );

                } else {

                    setStatus(
                        "No face detected"
                    );

                }


            } catch (error) {

                console.error(
                    "Frame processing error:",
                    error
                );


                setStatus(
                    "Server error: " +
                    error.message
                );

            } finally {

                processingFrame = false;

                loading.style.display =
                    "none";


                /*
                 * Process another frame after
                 * a short delay.
                 */

                if (isDetecting) {

                    setTimeout(
                        processFrame,
                        200
                    );

                }

            }

        }


        /* =====================================================
           SNAPSHOT
        ====================================================== */

        function takeSnapshot() {

            const link =
                document.createElement("a");


            /*
             * If processed image exists,
             * save that.
             */

            if (
                processedImage.style.display ===
                "block"
            ) {

                link.href =
                    processedImage.src;

                link.download =
                    "gender_detection_" +
                    Date.now() +
                    ".jpg";

            } else {

                /*
                 * Otherwise capture current webcam.
                 */

                if (
                    video.videoWidth === 0
                ) {

                    setStatus(
                        "Camera is not ready."
                    );

                    return;

                }


                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;


                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                link.href =
                    canvas.toDataURL(
                        "image/png"
                    );

                link.download =
                    "webcam_" +
                    Date.now() +
                    ".png";

            }


            link.click();

        }


        /* =====================================================
           PAGE LOAD
        ====================================================== */

        window.addEventListener(
            "load",
            () => {

                startWebcam();

            }
        );


        /* =====================================================
           PAGE CLOSE
        ====================================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                if (stream) {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }

            }
        );

    </script>

</body>
</html>
