<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Gender Detection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #1e1e2f;
      color: white;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background-color: #2b2b45;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar h2 {
      color: #00ffd0;
      font-size: 1.3rem;
    }

    .sidebar button {
      background-color: #00ffd0;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #00ffd0;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .video-container {
      border: 3px solid #00ffd0;
      border-radius: 12px;
      overflow: hidden;
      width: 90%;
      max-width: 600px;
      position: relative;
      background: #000;
    }

    video, #processedImage {
      width: 100%;
      display: block;
    }

    #processedImage {
      display: none;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 8px;
      border-radius: 5px;
      font-size: 0.9rem;
      display: none;
    }

    footer {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Detector</h2>
    <button onclick="toggleDetection()">⏯️ Start/Stop</button>
    <button onclick="takeSnapshot()">📸 Snapshot</button>
  </div>

  <div class="main">
    <h1>Gender Detection</h1>
    <div class="video-container">
      <video id="webcam" autoplay playsinline></video>
      <img id="processedImage">
      <div class="status" id="status"></div>
    </div>
    <footer>Made by Manish KD</footer>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const processedImage = document.getElementById('processedImage');
    const status = document.getElementById('status');
    let isDetecting = false;
    let detectionInterval = null;
    let canvas = document.createElement('canvas');
    let ctx = canvas.getContext('2d');

    // Start webcam with lower resolution for speed
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: 320,
            height: 240,
            facingMode: 'user'
          } 
        });
        video.srcObject = stream;
      } catch (err) {
        console.error('Webcam error:', err);
      }
    }

    function toggleDetection() {
      if (isDetecting) {
        stopDetection();
      } else {
        startDetection();
      }
    }

    function startDetection() {
      isDetecting = true;
      status.style.display = 'block';
      status.textContent = 'Detecting...';
      // Process every 500ms for smoother experience
      detectionInterval = setInterval(processFrame, 500);
    }

    function stopDetection() {
      isDetecting = false;
      status.style.display = 'none';
      processedImage.style.display = 'none';
      video.style.display = 'block';
      clearInterval(detectionInterval);
    }

    async function processFrame() {
      if (!isDetecting) return;

      try {
        // Set canvas size to match video
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Draw frame
        ctx.drawImage(video, 0, 0);
        
        // Get low quality JPEG for faster transfer
        const imageData = canvas.toDataURL('image/jpeg', 0.5);
        
        // Send to server
        const response = await fetch('/process_frame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Show processed image
          processedImage.src = result.image;
          processedImage.style.display = 'block';
          video.style.display = 'none';
          
          // Update status
          if (result.predictions.length > 0) {
            const pred = result.predictions[0];
            status.textContent = `${pred.gender}: ${(pred.confidence * 100).toFixed(1)}%`;
          } else {
            status.textContent = 'No face detected';
          }
        }
      } catch (err) {
        console.error('Error:', err);
      }
    }

    function takeSnapshot() {
      const link = document.createElement('a');
      if (processedImage.style.display === 'block') {
        link.href = processedImage.src;
        link.download = `detection_${Date.now()}.jpg`;
      } else {
        ctx.drawImage(video, 0, 0);
        link.href = canvas.toDataURL('image/png');
        link.download = `webcam_${Date.now()}.png`;
      }
      link.click();
    }

    startWebcam();
  </script>
</body>
</html>
